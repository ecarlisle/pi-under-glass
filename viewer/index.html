<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pi Under Glass</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main>
			<header>
				<div class="header-main">
					<h1>Pi Under Glass</h1>
					<span class="status" id="status" aria-live="polite">Connecting</span>
				</div>
				<section class="session-summary" aria-labelledby="session-heading">
					<h2 id="session-heading">Session usage</h2>
					<div class="metrics metrics-headline">
						<div><span>Elapsed</span><strong id="elapsed">00:00</strong></div>
						<div><span>Activity</span><strong id="activity">0 requests</strong></div>
						<div data-metric="tokens" hidden><span>Tokens</span><strong id="tokens"></strong></div>
						<div data-metric="cost" hidden><span>Cost</span><strong id="cost"></strong></div>
					</div>
					<div class="metrics metrics-detail">
						<div data-metric="reasoning" hidden><span>Reasoning</span><strong id="reasoning"></strong></div>
						<div data-metric="cache" hidden><span>Cache r/w</span><strong id="cache"></strong></div>
					</div>
					<div class="context-gauge" id="context-snapshot" hidden>
						<div class="context-gauge-label">
							<span>Context window</span>
							<span id="context-value"></span>
						</div>
						<div class="context-gauge-track" id="context-track">
							<div class="context-gauge-fill" id="context-fill"></div>
						</div>
					</div>
				</section>
			</header>

			<section class="transcript">
				<h2>Live transcript</h2>
				<div id="events">
					<p class="empty" id="empty">Send Pi a message to see live activity.</p>
				</div>
			</section>
		</main>
		<button type="button" class="jump-to-latest" id="jump-to-latest" hidden>↓ New activity</button>
		<aside class="options">
			<details class="options-inner" id="options-details">
				<summary>Options</summary>
				<div class="options-body">
					<div class="options-group">
						<span class="options-group-label">Show</span>
						<div class="options-controls">
							<label><input id="show-usage" type="checkbox" checked /> Usage details</label>
							<label><input id="show-tool-input" type="checkbox" checked /> Tool input</label>
							<label><input id="show-tool-results" type="checkbox" checked /> Tool results</label>
							<label><input id="show-timestamps" type="checkbox" /> Timestamps</label>
							<label><input id="show-thinking" type="checkbox" checked /> Thinking</label>
							<label><input id="show-system-prompt" type="checkbox" /> System prompt</label>
						</div>
					</div>
					<div class="options-group">
						<span class="options-group-label">Default expanded</span>
						<div class="options-controls">
							<label><input id="expand-thinking" type="checkbox" /> Thinking traces</label>
							<label><input id="expand-tools" type="checkbox" /> Tools</label>
						</div>
					</div>
				</div>
			</details>
		</aside>
		<script type="module" src="/app.js"></script>
	</body>
</html>
